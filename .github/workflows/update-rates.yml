name: Update Mortgage Rates

on:
  schedule:
    # Thursdays at 17:00 UTC (FRED publishes PMMS around 12:00 ET = 16:00/17:00 UTC)
    - cron: '0 17 * * 4'
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest rates from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node update-rates.js

      - name: Commit updated rates.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.json
          if git diff --cached --quiet; then
            echo "No rate changes this week."
          else
            git commit -m "Update rates.json"
            git push
          fi
