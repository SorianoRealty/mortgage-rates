name: Update Connecticut Security Deposit Rates
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: security-deposit-rate-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Excel readers
        run: python -m pip install xlrd==2.0.1 openpyxl==3.1.5
      - name: Download and validate official Excel table
        run: python scripts/update_security_deposit_rates.py
      - name: Commit only the updated deposit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- security-deposit-rates.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update verified CT security deposit rates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
